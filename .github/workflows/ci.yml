# ci.yml -- @zakkster/lite-ab-gate per-push / per-PR gate.
# DETERMINISTIC tier only: no step here is timed (no selftest, no gate run, no benchmark). The STATISTICAL verdict is
# .github/workflows/ab.yml, dispatched by the maintainer once per release candidate (C-3, C-24).
# Matrix: ubuntu-latest (x86) / macos-latest (arm64) x node 22 / 24 / 26, plus one leg per OS on the verdict pin
# 26.8.2 (AB_NODE in templates/ab.yml) = 8 legs. A red leg is a finding to rule; no step continues on error.
# npm ci + npm test on every leg. npm run torture (the package script owns the node flags) only on the node 26 legs,
# incl. the two 26.8.2 pin legs (C-31): on node 22 performance.now() boxes 16 B per read, so the zero-tool-bytes WINDOW
# row cannot hold there and test/torture.mjs exits 1 on node < 26 by design.
# The pin legs fail if setup-node resolved anything but templates/ab.yml's AB_NODE (the template and this matrix pin
# move together; test/docs.template.test.mjs checks both).
# Shallow checkout is fine: no test reads this repo's git history.

name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a default-branch run gets its own group (run_id): one pending run per group would let a newer default-branch run
# cancel a queued one; every other ref shares one group per ref and cancels its stale run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # 30: a first guess; re-size from the first run's wall times
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24', '26']
        include:
          - os: ubuntu-latest
            node: '26.8.2'
          - os: macos-latest
            node: '26.8.2'
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: provenance
        run: |
          node --version
          npm --version
          node -p "process.arch + ' ' + process.versions.v8"
          uname -a
      # fail the leg if setup-node resolved anything but the pin, or the pin drifted from templates/ab.yml's AB_NODE
      - name: node is exactly the verdict pin
        if: matrix.node == '26.8.2'
        env:
          PIN: ${{ matrix.node }}
        run: |
          want="$(sed -n "s/^ *AB_NODE: '\([0-9][0-9.]*\)'.*/\1/p" templates/ab.yml)"
          test -n "$want"
          test "$PIN" = "$want"
          test "$(node --version)" = "v$want"
      - name: npm ci
        run: npm ci
      - name: npm test
        run: npm test
      # C-31: torture on node >= 26 only (the 26 and 26.8.2 legs)
      - name: npm run torture
        if: startsWith(matrix.node, '26')
        run: npm run torture
