# ab.yml -- @zakkster/lite-ab-gate STATISTICAL A/B release gate: the workflow template (two parameters).
# Install the tool as a devDependency, copy this file into your repo, then edit ONLY the two lines tagged PARAM below
# (AB_GATE, AB_NODE); every other line stays byte for byte:
#   cp node_modules/@zakkster/lite-ab-gate/templates/ab.yml .github/workflows/ab.yml
# STATISTICAL tier, the release gate: run ONCE per release candidate by the maintainer, never on a schedule, never in
# `npm test` or `npm run verify`, never a required check. Dispatch-only (GitHub needs this file on the default branch):
#   gh workflow run ab.yml
# Verdict per OS (ABGate.js prints one `VERDICT ...` line and exits with it): 0 PASS | 3 FINDING | 2 NO VERDICT |
# 1 STOP / CRASH (also NO VERDICT). The gate passes only when BOTH OS read PASS in the same dispatch.
# A NO VERDICT run gets ONE re-dispatch; a FINDING is never re-run to get the word back.
# A harness failure on a runner (a failed step before the gate, a STOP, a crash) is NO VERDICT, never host evidence.
# AB_GATE: your gate file, repo-relative (no leading slash, no ~, no ..); the path guard step rejects anything else.
# Kernel paths inside it are relative to the gate file's directory; the tool STOPs HARNESS on an absolute path when
# GITHUB_ACTIONS=true, so nothing this workflow runs depends on a local absolute path.
# AB_NODE: the verdict pin, an exact x.y.z. A verdict is valid only on the node the method was proven on (26.8.2).
# AB_TOOL is fixed: the installed devDependency; `npm ci --ignore-scripts` installs it from your lockfile and runs no
# install script. FLAGS is exactly the tool's REQUIRED_FLAGS; the tool STOPs FLAGS on any missing one.
# Provenance records the tool's name and version and the sha256 of the tool, the gate file and the lockfile.
# Logs come back as one artifact per OS (ab-gate-<os>: provenance.log, selftest.log, gate.log, exit-code.txt):
#   gh run download <run-id>
# The VERDICT line of each OS is appended to the job summary.
# No concurrency group: each hosted job is a fresh VM, and a group would cancel a pending dispatch.
# timeout-minutes: 30 is a first guess; re-size it from your first dispatch's wall times.

name: ab

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ab:
    name: ab gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: X64
            nodearch: x64
          - os: macos-latest
            arch: ARM64
            nodearch: arm64
    env:
      AB_GATE: bench/ab.gate.mjs  # PARAM: your gate file, repo-relative
      AB_NODE: '26.8.2'  # PARAM: the verdict pin, exact x.y.z
      # fixed (do not edit): the tool as installed by npm ci
      AB_TOOL: node_modules/@zakkster/lite-ab-gate/ABGate.js
      # exactly the tool's REQUIRED_FLAGS. $FLAGS is expanded UNQUOTED below on purpose: one argv entry per flag.
      FLAGS: --expose-gc --allow-natives-syntax --no-concurrent-recompilation --min-semi-space-size=4 --max-semi-space-size=4 --single-threaded-gc
    steps:
      # runner identity, fail closed, before anything else (words do not transfer across CPUs)
      - name: runner identity
        env:
          WANT_OS: ${{ matrix.os }}
          WANT_ARCH: ${{ matrix.arch }}
        run: |
          : "${ImageOS:?unset}"
          test "$RUNNER_ARCH" = "$WANT_ARCH"
          case "$WANT_OS" in
            ubuntu-latest) test "$RUNNER_OS" = Linux ;;
            macos-latest) test "$RUNNER_OS" = macOS ;;
            *) echo "unexpected matrix os: $WANT_OS"; exit 1 ;;
          esac
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.AB_NODE }}
          architecture: ${{ matrix.nodearch }}
      # pin guard: AB_NODE must be an exact x.y.z, and setup-node must have resolved exactly it, on the matrix arch
      - name: node is exactly the pin
        env:
          WANT_NODEARCH: ${{ matrix.nodearch }}
        run: |
          if ! [[ "$AB_NODE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "AB_NODE must be an exact x.y.z, got: $AB_NODE"; exit 1; fi
          test "$(node --version)" = "v$AB_NODE"
          test "$(node -p process.arch)" = "$WANT_NODEARCH"
      # path guard: the gate file is repo-relative and exists (no leading slash, no ~, no ..)
      - name: gate file path
        run: |
          case "$AB_GATE" in
            /*|~*|*..*) echo "AB_GATE must be repo-relative, got: $AB_GATE"; exit 1 ;;
          esac
          test -f "$AB_GATE"
      - name: npm ci
        run: |
          npm ci --ignore-scripts
          test -f "$AB_TOOL"
      - name: provenance
        run: |
          mkdir -p logs
          echo 'none (gate not run)' > logs/exit-code.txt
          {
            echo "date -u: $(date -u)"
            echo "runner image: $ImageOS $ImageVersion"
            echo "runner: $RUNNER_OS / $RUNNER_ARCH"
            uname -a
            uptime
            node -v
            node -p "process.arch + ' ' + process.versions.v8"
            # assigned first, so a failed read fails the step (an echo would hide the status)
            tool="$(node -p "const p = JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')); p.name + ' ' + p.version" "$(dirname "$AB_TOOL")/package.json")"
            echo "tool: $tool"
            echo "gate: $AB_GATE"
            echo "flags: $FLAGS"
            shasum -a 256 "$AB_TOOL" "$AB_GATE" package-lock.json
            case "$RUNNER_OS" in
              Linux)
                lscpu
                echo "nproc: $(nproc)"
                getconf -a | grep -i CACHE
                echo "PAGESIZE: $(getconf PAGESIZE)"
                # informational: sysfs cache entries may be absent in a VM; their absence is not a failure
                grep . /sys/devices/system/cpu/cpu0/cache/index*/{level,type,size,coherency_line_size} || true
                ;;
              macOS)
                echo "cpu: $(sysctl -n machdep.cpu.brand_string)"
                sysctl hw.ncpu hw.cachelinesize hw.pagesize hw.l1dcachesize hw.l2cachesize
                # informational: a key missing in the hosted VM is not a failure
                sysctl hw.physicalcpu hw.logicalcpu hw.l1icachesize || true
                # informational: hw.perflevel* exists only on Apple silicon; its absence is not a failure
                sysctl -a | grep -E '^hw\.perflevel' || true
                ;;
              *)
                echo "unexpected RUNNER_OS: $RUNNER_OS"
                exit 1
                ;;
            esac
          } 2>&1 | tee logs/provenance.log
      # STOP gate: every selftest case must pass, else no gate run
      - name: selftest
        run: |
          node $FLAGS "$AB_TOOL" "$AB_GATE" --selftest 2>&1 | tee logs/selftest.log
          grep -qx 'SELFTEST all ok' logs/selftest.log
      # the step's status is the tool's verdict code: 0 PASS / 3 FINDING / 2 NO VERDICT / 1 STOP (recorded in exit-code.txt)
      - name: gate (--run ALL)
        run: |
          set +e
          node $FLAGS "$AB_TOOL" "$AB_GATE" --run ALL 2>&1 | tee logs/gate.log
          st=("${PIPESTATUS[@]}")
          set -e
          echo "${st[0]}" > logs/exit-code.txt
          # a failed tee means an incomplete log: fail the step whatever the tool returned
          test "${st[1]}" = 0
          exit "${st[0]}"
      - name: verdict to the job summary
        if: always()
        env:
          MOS: ${{ matrix.os }}
        run: |
          {
            echo "### ab gate, $MOS (exit $(cat logs/exit-code.txt 2>/dev/null || echo 'none'))"
            echo
            echo '```'
            if [ -f logs/gate.log ] && grep -q '^VERDICT ' logs/gate.log; then
              grep '^VERDICT ' logs/gate.log
            else
              echo 'no VERDICT line: the gate did not run or did not finish (NO VERDICT)'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ab-gate-${{ matrix.os }}
          path: logs/
          retention-days: 30
          if-no-files-found: error
